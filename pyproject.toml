[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predicta-arco-climate"
version = "0.4.0"
description = "Predicta climate router and historical store using ERA5-Land ARCO"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "xarray>=2025.1",
  "zarr>=2.18,<4",
  "fsspec>=2024.10",
  "httpio>=0.3",
  "dask[array]>=2025.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
